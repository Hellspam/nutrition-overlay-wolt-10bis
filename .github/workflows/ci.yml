name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package zip
        run: cd dist && zip -qr ../nutrition-overlay.zip .

      # Download the built extension from the run's "Artifacts" section.
      - uses: actions/upload-artifact@v7
        with:
          name: nutrition-overlay
          path: nutrition-overlay.zip
          if-no-files-found: error
